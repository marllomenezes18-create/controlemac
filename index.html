<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Créditos Cloud</title>

<style>
    /* Estilos Gerais - Design Moderno */
    body {
        background: #0f172a; 
        color: #f1f5f9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
    }

    h1 {
        color: #38bdf8;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        margin-bottom: 30px;
        text-transform: uppercase;
        font-size: 1.5rem;
    }

    /* Cards */
    .card {
        background: #1e293b;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
        width: 100%;
        max-width: 900px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        border: 1px solid #334155;
    }

    h2 {
        font-size: 1.1rem;
        margin-top: 0;
        border-bottom: 2px solid #38bdf8;
        display: inline-block;
        padding-bottom: 5px;
        margin-bottom: 20px;
        color: #38bdf8;
    }

    /* Inputs e Selects */
    input, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #334155;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
        transition: border-color 0.3s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #38bdf8;
    }

    /* Botões */
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #0284c7;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
    }

    button:hover { background: #0ea5e9; }
    
    .btn-excluir {
        background: #ef4444;
        padding: 6px 10px;
        font-size: 11px;
        margin-top: 5px;
    }
    .btn-excluir:hover { background: #dc2626; }

    /* Tabela */
    .table-container { overflow-x: auto; }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 10px;
    }

    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #334155;
        font-size: 14px;
    }

    th {
        background: #334155;
        color: #38bdf8;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Status */
    .lucro { color: #4ade80; font-weight: bold; }

    .copy {
        background: #16a34a;
        padding: 6px 10px;
        font-size: 11px;
        width: auto;
        display: inline-block;
    }
</style>
</head>
<body>

<h1>💳 Central de Créditos Cloud</h1>

<div class="card">
    <h2>Adicionar Crédito</h2>
    
    <input type="text" id="revendedor" placeholder="Nome do Revendedor">
    <input type="text" id="servidor" placeholder="Servidor">

    <select id="quantidade">
        <option value="">Selecione a Quantidade</option>
        <option value="10">10 Créditos</option>
        <option value="50">50 Créditos</option>
        <option value="100">100 Créditos</option>
        <option value="500">500 Créditos</option>
        <option value="1000">1000 Créditos</option>
    </select>

    <div style="display: flex; gap: 10px;">
        <input type="number" id="master" placeholder="Custo Master (Ex: 500)">
        <input type="number" id="revenda" placeholder="Venda Revenda (Ex: 800)">
    </div>

    <button id="btnSalvar">Salvar no Firebase</button>
</div>

<div class="card">
    <h2>Histórico de Registros</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Revendedor</th>
                    <th>Servidor</th>
                    <th>Qtd</th>
                    <th>Master</th>
                    <th>Venda</th>
                    <th>Lucro</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
