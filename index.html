<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA IPTV CLOUD</title>
    <style>
        /* ESTILO DE EMERGÊNCIA - FORÇA A VISIBILIDADE */
        html, body {
            background: #000 !important;
            color: #fff !important;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }

        /* DASHBOARD - ABAS COLORIDAS */
        .dashboard {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .c-blue { background: #0081ff; }
        .c-green { background: #28a745; }
        .c-red { background: #dc3545; }
        .c-orange { background: #fd7e14; }

        /* FORMULÁRIO - FUNDO CINZA COM INPUTS BRANCOS */
        .form-container {
            background: #1a1a1a;
            padding: 20px;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            color: #00d4ff;
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100% !important;
            height: 45px !important;
            background: #ffffff !important;
            color: #000000 !important;
            border: none !important;
            border-radius: 5px !important;
            margin-bottom: 15px !important;
            padding: 0 10px !important;
            display: block !important;
            font-size: 16px !important;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            height: 50px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        /* BARRA DE PESQUISA */
        .search-container { margin-bottom: 15px; }
        .search-container input {
            border: 2px solid #00d4ff !important;
            background: #111 !important;
            color: #fff !important;
        }

        /* TABELA */
        .tabela-area {
            background: #111;
            border-radius: 8px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { color: #00d4ff; padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; font-size: 14px; }
        
        .btn-edit {
            background: #0081ff;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#00d4ff;">CONTROLE IPTV AMIGOSARU</h2>

    <div class="dashboard">
        <div class="card c-blue"><span id="q-total">0</span><br>CLIENTES</div>
        <div class="card c-green"><span id="q-ativos">0</span><br>ATIVOS</div>
        <div class="card c-red"><span id="q-vencidos">0</span><br>VENCIDOS</div>
        <div class="card c-orange">OK<br>NUVEM</div>
    </div>

    <div class="form-container">
        <!-- Campo oculto para controlar se estamos editando -->
        <input type="hidden" id="edit_id">
        
        <label>NOME DO CLIENTE</label>
        <input type="text" id="nome_cli">

        <label>NOME DO APLICATIVO / SERVIDOR</label>
        <input type="text" id="app_cli">

        <label>ENDEREÇO MAC (MEC)</label>
        <input type="text" id="mac_cli">

        <label>CHAVE (DEVICE KEY)</label>
        <input type="text" id="key_cli">

        <label>DATA DE VENCIMENTO</label>
        <input type="date" id="data_cli">

        <button id="btnSalvar">SALVAR NO BANCO</button>
    </div>

    <div class="search-container">
        <input type="text" id="inputBusca" placeholder="🔍 Pesquisar cliente pelo nome..." onkeyup="filtrarTabela()">
    </div>

    <div class="tabela-area">
        <table>
            <thead>
                <tr>
                    <th>CLIENTE/APP</th>
                    <th>ACESSO</th>
                    <th>STATUS</th>
                    <th>X</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <script>
        function filtrarTabela() {
            const input = document.getElementById("inputBusca").value.toUpperCase();
            const rows = document.getElementById("tabela-corpo").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                const nomeColuna = rows[i].getElementsByTagName("td")[0];
                if (nomeColuna) {
                    const texto = nomeColuna.textContent || nomeColuna.innerText;
                    rows[i].style.display = texto.toUpperCase().indexOf(input) > -1 ? "" : "none";
                }
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsqUeXLDpUhxvHxXOC19iRoQhPuYOGpFw",
            authDomain: "amigosaru-6a228.firebaseapp.com",
            projectId: "amigosaru-6a228",
            storageBucket: "amigosaru-6a228.firebasestorage.app",
            messagingSenderId: "1024825583351",
            appId: "1:1024825583351:web:933615156292cd006c55f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "clientes");

        const btnSalvar = document.getElementById("btnSalvar");
        const editIdInput = document.getElementById("edit_id");

        btnSalvar.onclick = async () => {
            const id = editIdInput.value;
            const dados = {
                nome: document.getElementById("nome_cli").value,
                app: document.getElementById("app_cli").value,
                mac: document.getElementById("mac_cli").value,
                key: document.getElementById("key_cli").value,
                data: document.getElementById("data_cli").value
            };

            if(!dados.nome || !dados.data) return alert("Preencha Nome e Data!");

            if(id) {
                // Modo Edição
                await updateDoc(doc(db, "clientes", id), dados);
                editIdInput.value = "";
                btnSalvar.innerText = "SALVAR NO BANCO";
                btnSalvar.style.background = "#00d4ff";
            } else {
                // Modo Novo Cadastro
                await addDoc(colRef, dados);
            }
            
            document.querySelectorAll(".form-container input").forEach(i => i.value = "");
        };

        onSnapshot(colRef, (snap) => {
            const html = document.getElementById("tabela-corpo");
            html.innerHTML = "";
            let t=0, a=0, v=0;

            snap.forEach((d) => {
                const c = d.data();
                t++;
                let hoje = new Date(); hoje.setHours(0,0,0,0);
                let dV = new Date(c.data);
                dV.setMinutes(dV.getMinutes() + dV.getTimezoneOffset());
                const status = dV >= hoje;
                if(status) a++; else v++;

                // Aqui injetamos os dados para a função de editar via strings
                const dadosCli = JSON.stringify({id: d.id, ...c}).replace(/"/g, '&quot;');

                html.innerHTML += `
                    <tr>
                        <td><b>${c.nome}</b><br><small style="color:#00d4ff">${c.app || ''}</small></td>
                        <td>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>${c.mac || ''}<br><small style="color:gray">${c.key || ''}</small></span>
                                <button class="btn-edit" onclick='window.prepararEdicao("${dadosCli}")'>✎</button>
                            </div>
                        </td>
                        <td style="color:${status?'#00ff88':'#ff4d4d'}">${status?'ATIVO':'VENCIDO'}</td>
                        <td><button onclick="window.del('${d.id}')" style="width:auto; height:auto; padding:5px; background:red; color:white;">X</button></td>
                    </tr>
                `;
            });
            document.getElementById("q-total").innerText = t;
            document.getElementById("q-ativos").innerText = a;
            document.getElementById("q-vencidos").innerText = v;
            if(document.getElementById("inputBusca").value !== "") filtrarTabela();
        });

        window.prepararEdicao = (jsonStr) => {
            const c = JSON.parse(jsonStr);
            document.getElementById("edit_id").value = c.id;
            document.getElementById("nome_cli").value = c.nome;
            document.getElementById("app_cli").value = c.app || "";
            document.getElementById("mac_cli").value = c.mac || "";
            document.getElementById("key_cli").value = c.key || "";
            document.getElementById("data_cli").value = c.data;
            
            btnSalvar.innerText = "ATUALIZAR DADOS";
            btnSalvar.style.background = "#ffc107";
            window.scrollTo(0,0);
        };

        window.del = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "clientes", id)); };
    </script>
</body>
</html>
