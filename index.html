<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA IPTV CLOUD</title>
    <style>
        /* ESTILO DE EMERGÊNCIA - FORÇA A VISIBILIDADE */
        html, body {
            background: #000 !important;
            color: #fff !important;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }

        /* DASHBOARD - ABAS COLORIDAS */
        .dashboard {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .c-blue { background: #0081ff; }
        .c-green { background: #28a745; }
        .c-red { background: #dc3545; }
        .c-orange { background: #fd7e14; }

        /* FORMULÁRIO - FUNDO CINZA COM INPUTS BRANCOS */
        .form-container {
            background: #1a1a1a;
            padding: 20px;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            color: #00d4ff;
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100% !important;
            height: 45px !important;
            background: #ffffff !important; /* FUNDO BRANCO PARA NÃO SUMIR */
            color: #000000 !important;    /* LETRA PRETA */
            border: none !important;
            border-radius: 5px !important;
            margin-bottom: 15px !important;
            padding: 0 10px !important;
            display: block !important;
            font-size: 16px !important;
        }

        button {
            width: 100%;
            height: 50px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        /* TABELA */
        .tabela-area {
            background: #111;
            border-radius: 8px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { color: #00d4ff; padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; font-size: 14px; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#00d4ff;">CONTROLE IPTV AMIGOSARU</h2>

    <div class="dashboard">
        <div class="card c-blue"><span id="q-total">0</span><br>CLIENTES</div>
        <div class="card c-green"><span id="q-ativos">0</span><br>ATIVOS</div>
        <div class="card c-red"><span id="q-vencidos">0</span><br>VENCIDOS</div>
        <div class="card c-orange">OK<br>NUVEM</div>
    </div>

    <div class="form-container">
        <label>NOME DO CLIENTE</label>
        <input type="text" id="nome_cli">

        <label>NOME DO APLICATIVO / SERVIDOR</label>
        <input type="text" id="app_cli">

        <label>ENDEREÇO MAC (MEC)</label>
        <input type="text" id="mac_cli">

        <label>CHAVE (DEVICE KEY)</label>
        <input type="text" id="key_cli">

        <label>DATA DE VENCIMENTO</label>
        <input type="date" id="data_cli">

        <button id="btnSalvar">SALVAR NO BANCO</button>
    </div>

    <div class="tabela-area">
        <table>
            <thead>
                <tr>
                    <th>CLIENTE/APP</th>
                    <th>ACESSO</th>
                    <th>STATUS</th>
                    <th>X</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsqUeXLDpUhxvHxXOC19iRoQhPuYOGpFw",
            authDomain: "amigosaru-6a228.firebaseapp.com",
            projectId: "amigosaru-6a228",
            storageBucket: "amigosaru-6a228.firebasestorage.app",
            messagingSenderId: "1024825583351",
            appId: "1:1024825583351:web:933615156292cd006c55f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "clientes");

        document.getElementById("btnSalvar").onclick = async () => {
            const dados = {
                nome: document.getElementById("nome_cli").value,
                app: document.getElementById("app_cli").value,
                mac: document.getElementById("mac_cli").value,
                key: document.getElementById("key_cli").value,
                data: document.getElementById("data_cli").value
            };

            if(!dados.nome || !dados.data) return alert("Preencha Nome e Data!");

            await addDoc(colRef, dados);
            document.querySelectorAll("input").forEach(i => i.value = "");
        };

        onSnapshot(colRef, (snap) => {
            const html = document.getElementById("tabela-corpo");
            html.innerHTML = "";
            let t=0, a=0, v=0;

            snap.forEach((d) => {
                const c = d.data();
                t++;
                let hoje = new Date(); hoje.setHours(0,0,0,0);
                let dV = new Date(c.data);
                dV.setMinutes(dV.getMinutes() + dV.getTimezoneOffset());
                const status = dV >= hoje;
                if(status) a++; else v++;

                html.innerHTML += `
                    <tr>
                        <td><b>${c.nome}</b><br><small style="color:#00d4ff">${c.app || ''}</small></td>
                        <td>${c.mac || ''}<br><small style="color:gray">${c.key || ''}</small></td>
                        <td style="color:${status?'#00ff88':'#ff4d4d'}">${status?'ATIVO':'VENCIDO'}</td>
                        <td><button onclick="window.del('${d.id}')" style="width:auto; height:auto; padding:5px; background:red; color:white;">X</button></td>
                    </tr>
                `;
            });
            document.getElementById("q-total").innerText = t;
            document.getElementById("q-ativos").innerText = a;
            document.getElementById("q-vencidos").innerText = v;
        });

        window.del = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "clientes", id)); };
    </script>
</body>
</html>
